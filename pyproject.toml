[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyautogui-agent"
version = "0.2.0"
description = "Agent-friendly companion layer on top of PyAutoGUI: structured screen elements, waits, task-level actions, and a safety layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sumant Jain" },
]
dependencies = [
    "pyautogui>=0.9.50",
    "Pillow>=9.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
macos = [
    "pyobjc-core>=9.0",
    "pyobjc-framework-ApplicationServices>=9.0",
    "pyobjc-framework-AppKit>=9.0",
]
windows = ["comtypes>=1.2.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sammyjain95/pyautogui-agent"

[tool.setuptools.packages.find]
include = ["pyautogui_agent*"]

[tool.setuptools.package-data]
"pyautogui_agent" = ["llms.txt", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
